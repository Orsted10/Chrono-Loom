<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Chrono-Loom | Meta VR Start Developer Competition 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-void: #030712;
        --cyan-neon: #00f0ff;
        --cyan-glow: rgba(0, 240, 255, 0.35);
        --purple-neon: #a855f7;
        --purple-glow: rgba(168, 85, 247, 0.3);
        --emerald-neon: #10b981;
        --gold-neon: #f59e0b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --glass-bg: rgba(7, 24, 45, 0.72);
        --glass-border: rgba(0, 240, 255, 0.22);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }

      /* Glassmorphic UI HUD Container */
      #hud-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 30px;
        z-index: 10;
      }

      /* Header Bar */
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .brand-box {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 16px 20px;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        pointer-events: auto;
      }

      .brand-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ffffff 0%, var(--cyan-neon) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
      }


<!-- [Chrono-Loom Milestone 1/8] feat(ui): scaffold base HTML5 canvas container and WebXR viewport meta tags -->
