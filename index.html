      :root {

      * {

        padding: 0;
        user-select: none;

      body {
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;

        height: 100vh;

      canvas {

      /* Glassmorphic UI HUD Container */
      #hud-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 30px;
        z-index: 10;
      }

      /* Header Bar */

        display: flex;

        backdrop-filter: blur(16px);

        pointer-events: auto;

        align-items: center;
        gap: 8px;
      }
