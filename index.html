<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Chrono-Loom | Meta VR Start Developer Competition 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-void: #030712;
        --cyan-neon: #00f0ff;
        --cyan-glow: rgba(0, 240, 255, 0.35);
        --purple-neon: #a855f7;
        --purple-glow: rgba(168, 85, 247, 0.3);
        --emerald-neon: #10b981;
        --gold-neon: #f59e0b;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --glass-bg: rgba(7, 24, 45, 0.72);
        --glass-border: rgba(0, 240, 255, 0.22);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg-void);
        color: var(--text-primary);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }

      /* Glassmorphic UI HUD Container */
      #hud-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 22px 30px;
        z-index: 10;
      }

      /* Header Bar */
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .brand-box {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 16px 20px;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        pointer-events: auto;
      }

      .brand-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(135deg, #ffffff 0%, var(--cyan-neon) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand-sub {
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
        letter-spacing: 1.5px;
        color: var(--purple-neon);
        margin-top: 4px;
        text-transform: uppercase;
      }

      .mode-badge-box {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        pointer-events: auto;
      }

      .badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        padding: 6px 14px;
        border-radius: 9999px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .badge::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }

      .badge-cyan {
        background: rgba(0, 240, 255, 0.12);
        color: var(--cyan-neon);
        border: 1px solid rgba(0, 240, 255, 0.35);
      }
      .badge-cyan::before {
        background: var(--cyan-neon);
        box-shadow: 0 0 8px var(--cyan-neon);
      }

      .badge-green {
        background: rgba(16, 185, 129, 0.15);
        color: var(--emerald-neon);
        border: 1px solid rgba(16, 185, 129, 0.4);
      }
      .badge-green::before {
        background: var(--emerald-neon);
        box-shadow: 0 0 8px var(--emerald-neon);
      }

      .badge-emerald {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.4);
      }
      .badge-emerald::before {
        background: #34d399;
        box-shadow: 0 0 8px #34d399;
      }

      .badge-gold {
        background: rgba(245, 158, 11, 0.18);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.45);
      }
      .badge-gold::before {
        background: #fbbf24;
        box-shadow: 0 0 8px #fbbf24;
      }

      .badge-purple {
        background: rgba(168, 85, 247, 0.2);
        color: #c084fc;
        border: 1px solid rgba(168, 85, 247, 0.45);
      }
      .badge-purple::before {
        background: #c084fc;
        box-shadow: 0 0 8px #c084fc;
      }

      .badge-rose {
        background: rgba(244, 63, 94, 0.2);
        color: #fb7185;
        border: 1px solid rgba(244, 63, 94, 0.45);
      }
      .badge-rose::before {
        background: #f43f5e;
        box-shadow: 0 0 8px #f43f5e;
      }

      .badge-muted {
        background: rgba(148, 163, 184, 0.1);
        color: var(--text-secondary);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      /* Telemetry Grid */
      .hud-telemetry {
        display: grid;
        grid-template-columns: repeat(5, 155px);
        gap: 10px;
        margin-top: 14px;
      }

      .telemetry-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 12px 14px;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        pointer-events: auto;
      }

      .telemetry-label {
        font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .telemetry-value {
        font-size: 20px;
        font-weight: 700;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-primary);
        margin: 4px 0;
      }

      .status-tag {
        font-size: 9.5px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status-rest {
        background: rgba(148, 163, 184, 0.15);
        color: #cbd5e1;
      }

      .status-near {
        background: rgba(234, 179, 8, 0.2);
        color: #fde047;
        border: 1px solid rgba(234, 179, 8, 0.4);
      }

      .status-pinched {
        background: rgba(0, 240, 255, 0.25);
        color: var(--cyan-neon);
        border: 1px solid var(--cyan-neon);
        box-shadow: 0 0 10px var(--cyan-glow);
      }

      /* Cheatsheet Card & Bottom Actions */
      .hud-bottom {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .cheatsheet-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 16px 20px;
        backdrop-filter: blur(16px);
        max-width: 520px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
      }

      .cheatsheet-title {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--cyan-neon);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .cheatsheet-list {
        list-style: none;
        font-size: 11px;
        line-height: 1.55;
        color: var(--text-secondary);
      }

      .cheatsheet-list strong {
        color: var(--text-primary);
      }

      .cheatsheet-list kbd {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 1px 5px;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-primary);
        font-size: 10px;
      }

      .hud-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      .action-btn {
        background: rgba(0, 240, 255, 0.12);
        border: 1px solid rgba(0, 240, 255, 0.35);
        color: var(--cyan-neon);
        font-family: 'Space Grotesk', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .action-btn:hover {
        background: rgba(0, 240, 255, 0.25);
        box-shadow: 0 0 12px var(--cyan-glow);
        transform: translateY(-1px);
      }

      .action-btn-gold {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.4);
        color: #fbbf24;
      }

      .action-btn-gold:hover {
        background: rgba(245, 158, 11, 0.3);
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
      }

      .action-btn-purple {
        background: rgba(168, 85, 247, 0.18);
        border-color: rgba(168, 85, 247, 0.45);
        color: #c084fc;
      }

      .action-btn-purple:hover {
        background: rgba(168, 85, 247, 0.35);
        box-shadow: 0 0 14px rgba(168, 85, 247, 0.5);
      }

      .action-btn-purple.active {
        background: rgba(16, 185, 129, 0.35);
        border-color: var(--emerald-neon);
        color: #34d399;
        box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
        animation: recPulse 1.2s infinite ease-in-out;
      }

      .aria-chips-drawer {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        padding: 8px 12px;
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 8px;
        backdrop-filter: blur(10px);
      }

      .chip-btn {
        background: rgba(168, 85, 247, 0.12);
        border: 1px solid rgba(168, 85, 247, 0.35);
        color: #e9d5ff;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .chip-btn:hover {
        background: rgba(168, 85, 247, 0.3);
        border-color: #c084fc;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
      }

      .action-btn.active {
        background: rgba(16, 185, 129, 0.25);
        border-color: var(--emerald-neon);
        color: #34d399;
      }

      /* Unified WebXR Launch Toolbar (VR Void + Mixed Reality AR Passthrough) */
      .webxr-toolbar-container {
        position: fixed !important;
        bottom: 22px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 14px !important;
        z-index: 100 !important;
        pointer-events: auto !important;
      }

      #vr-button-element,
      #ar-button-element {
        position: static !important;
        transform: none !important;
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.22) 0%, rgba(168, 85, 247, 0.28) 100%) !important;
        border: 1px solid var(--cyan-neon) !important;
        border-radius: 9999px !important;
        color: #ffffff !important;
        font-family: 'Space Grotesk', sans-serif !important;
        font-size: 12.5px !important;
        font-weight: 700 !important;
        letter-spacing: 1.5px !important;
        text-transform: uppercase !important;
        padding: 12px 24px !important;
        width: auto !important;
        min-width: 175px !important;
        backdrop-filter: blur(14px) !important;
        box-shadow: 0 0 24px var(--cyan-glow) !important;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        cursor: pointer !important;
      }

      #ar-button-element {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(0, 240, 255, 0.25) 100%) !important;
        border: 1px solid var(--emerald-neon) !important;
        box-shadow: 0 0 24px rgba(16, 185, 129, 0.45) !important;
      }

      #vr-button-element:hover {
        background: linear-gradient(135deg, rgba(0, 240, 255, 0.4) 0%, rgba(168, 85, 247, 0.45) 100%) !important;
        box-shadow: 0 0 36px rgba(0, 240, 255, 0.65) !important;
        transform: translateY(-2px) scale(1.03) !important;
      }

      #ar-button-element:hover {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.45) 0%, rgba(0, 240, 255, 0.38) 100%) !important;
        box-shadow: 0 0 36px rgba(16, 185, 129, 0.75) !important;
        transform: translateY(-2px) scale(1.03) !important;
      }

      /* Demo Recording Live Telemetry Bar (Bottom-Right) */
      .demo-telemetry-container {
        position: fixed;
        bottom: 22px;
        right: 24px;
        background: rgba(7, 24, 45, 0.88);
        border: 1px solid rgba(0, 240, 255, 0.35);
        border-radius: 12px;
        padding: 12px 16px;
        backdrop-filter: blur(16px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), 0 0 16px rgba(0, 240, 255, 0.15);
        z-index: 90;
        pointer-events: auto;
        min-width: 320px;
        max-width: 380px;
        font-family: 'JetBrains Mono', monospace;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .demo-telemetry-container.minimized .demo-telemetry-body {
        display: none;
      }

      .demo-telemetry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .rec-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 700;
        color: var(--cyan-neon);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ef4444;
        box-shadow: 0 0 8px #ef4444;
        animation: recPulse 1.4s infinite ease-in-out;
      }

      @keyframes recPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }

      .toggle-telemetry-btn {
        background: rgba(0, 240, 255, 0.12);
        border: 1px solid rgba(0, 240, 255, 0.35);
        color: var(--cyan-neon);
        font-size: 10px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .toggle-telemetry-btn:hover {
        background: rgba(0, 240, 255, 0.25);
        box-shadow: 0 0 8px var(--cyan-glow);
      }

      .demo-telemetry-body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 10.5px;
        line-height: 1.45;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: 8px;
        margin-top: 8px;
      }

      .telemetry-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .telemetry-key {
        color: var(--text-secondary);
      }

      .telemetry-val {
        color: #38bdf8;
        font-weight: 600;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <!-- 2D Heads-Up Display Telemetry Overlay -->
    <div id="hud-overlay">
      <div class="hud-header">
        <div class="brand-box">
          <div class="brand-title">
            <span>CHRONO-LOOM</span>
          </div>
